<!doctype html><html lang="es"><meta charset="UTF-8"><style>body{background:#10151d;color:#eee;font:16px system-ui;padding:28px}button{padding:12px 24px;background:#8464dc;color:white;border:0;border-radius:8px}progress{width:100%;margin:20px 0}#error{color:#ffb2a4;white-space:pre-wrap}</style><h2>Preparar WorkHub para actualizaciones online</h2><p>Se conservan tus cuentas, pestañas y preferencias. El instalador independiente mostrará el progreso antes de cerrar esta ventana.</p><button id="start">Preparar e instalar</button><progress id="progress" max="100" value="0"></progress><p id="status">Se reutilizará el motor local si coincide con la entrega publicada.</p><p id="bytes"></p><p id="elapsed">00:00</p><pre id="error"></pre><script>
let began;const button=document.getElementById('start');button.onclick=async()=>{button.disabled=true;began=Date.now();const r=await window.transition.start();if(r.error){document.getElementById('error').textContent=r.error;button.disabled=false;}};
window.transition.state(s=>{document.getElementById('status').textContent=s.message;const p=document.getElementById('progress');if(s.total)p.value=s.completed/s.total*100;else p.removeAttribute('value');document.getElementById('bytes').textContent=s.received?`${s.received} / ${s.size||'?'} bytes`:s.total?`${s.completed} / ${s.total} archivos`:'';});
setInterval(()=>{if(began){let n=Math.floor((Date.now()-began)/1000);document.getElementById('elapsed').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}},250);
</script></html>

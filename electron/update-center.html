<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Actualizar WorkHub</title><link rel="stylesheet" href="update-center.css"></head><body><main><header><img id="logo" src="../assets/workhub.png" alt=""><div><small>WORKHUB</small><h1 id="heading">Actualizar programa</h1></div></header><section id="channel-section"><label for="channel">Canal GitHub · latest.json</label><div class="channel-row"><input id="channel" type="url" placeholder="URL del canal de GitHub"><button id="save-channel">Guardar canal</button></div><div class="versions"><span>Instalada <strong id="installed">—</strong></span><span>Disponible <strong id="available">—</strong></span></div><div class="actions"><button id="check" class="primary">Buscar actualizaciones</button><button id="download" class="primary" disabled>Descargar e instalar</button><button id="local">Instalar ZIP local</button><button id="full" disabled>Paquete completo</button></div></section><section class="progress-panel" aria-live="polite"><div class="stage-line"><strong id="stage">Listo</strong><span id="percent"></span></div><progress id="progress" max="100" value="0"></progress><p id="message">Buscá una actualización o elegí un ZIP local.</p><div class="metrics"><span id="bytes"></span><span id="elapsed">00:00</span></div><p id="detail"></p><button id="cancel" disabled>Cancelar</button></section><footer id="footer">Los parches conservan tus datos y preferencias. El paquete completo es para instalar o reparar.</footer></main><script src="update-center.js"></script></body></html>
